AutoName: Graphical BSD Games

Description: |-
  Touch-friendly graphical frontends for four classic BSD games.

  <b>ATC – Air Traffic Control</b>
  Guide aircraft through your airspace to their destination exits and
  airports without collisions. Full keyboard command set (identical to the
  original NetBSD atc) plus a tap-to-select touch interface. Multiple
  built-in scenarios from easy to Killer.

  <b>Boggle</b>
  Find words by connecting adjacent letter tiles on a 4×4 (Classic) or
  5×5 (Big Boggle) board before the timer runs out. Drag or tap to build
  words. Scoring follows the original BSD percentage model by default
  (words found / total possible), with optional Hasbro point scoring.

  <b>Hangman</b>
  Guess the hidden word one letter at a time. Word list derived from
  high-frequency English words so guesses feel fair.

  <b>Tetris</b>
  The classic falling-block game. Tap to rotate, swipe to move and soft-
  drop, dedicated Drop button for hard drop.

  No ads. No tracking. No network access required.

RepoType: git
Repo: https://github.com/lschierer/graphical-bsdgames

Builds:
  - versionName: 0.8.1
    versionCode: 1
    commit: v0.8.1
    subdir: app
    scandelete:
      - fortune/tools/do_sort
    build:
      - flutter pub get
      - flutter build apk --release --split-per-abi
    output: build/app/outputs/flutter-apk/app-*-release.apk
    novcheck: true

AutoUpdateMode: Version
UpdateCheckMode: Tags v(.+)
# ABI split: the gradle versionCodeOverride (app/android/app/build.gradle.kts)
# assigns each per-ABI APK a code of `versionCode * 10 + abi`
# (armeabi-v7a=1, arm64-v8a=2, x86_64=3). VercodeOperation must mirror that
# so F-Droid registers all three APKs.
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
  - '%c * 10 + 3'
CurrentVersion: 0.8.1
CurrentVersionCode: 13
